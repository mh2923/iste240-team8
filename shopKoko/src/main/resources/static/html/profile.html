<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ShopKoko</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<div id="main-container">

    <!-- Top Bar -->
    <div id="topbar">
        <!-- Company Name -->
        <div id="company-name">
            <a href="/">ShopKoko</a>
        </div>
        <!--Semantic UI SearchBar-->
        <div id="search-bar">
            <div class="ui search">
                <div class="ui icon input">
                    <input class="prompt" type="text" placeholder="Search products...">
                    <i class="search icon"></i>
                </div>
                <div class="results"></div>
            </div>
        </div>
        <!--Semantic UI Button-->
        <div id="topbar-options">
            <a href="/login">
                <button class="ui active button">
                    <i class="user icon"></i>
                    Sign In
                </button>
            </a>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav id="navbar">
        <div class="ui menu">
            <a class="item" href="/">Home</a>
            <a class="item" href="/products">All Products</a>
            <a class="item" href="/manage-products">Manage Products</a>
            <a class="item" href="/manage-categories">Manage Categories</a>
            <a class="item" href="/manage-sellers">Manage Sellers</a>
            <a class="item active" href="/profile">Profile</a>
        </div>
    </nav>

    <!-- Profile Section -->
    <div id="profile-section">

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-item active" id="show-profile-btn"><i class="user icon"></i> My Profile</div>
            <div class="sidebar-item" id="show-orders-btn"><i class="box icon"></i> My Orders</div>
            <div class="sidebar-item"><i class="map marker icon"></i> Addresses</div>
            <div class="sidebar-item"><i class="sign out icon"></i> Sign Out</div>
        </div>

        <!-- Profile Card -->
        <div id="profile-card">
            <div id="profile-details">
                <h2 id="profile-name">John Doe</h2>
                <div class="ui list">
                    <div class="item">
                        <i class="mail icon"></i>
                        <div class="content" id="profile-email">johndoe@email.com</div>
                    </div>
                    <div class="item">
                        <i class="phone icon"></i>
                        <div class="content" id="profile-phone">+1 234 567 8900</div>
                    </div>
                    <div class="item">
                        <i class="marker icon"></i>
                        <div class="content" id="profile-address">123 Main Street, Dubai</div>
                    </div>
                </div>
                <button class="ui button" id="edit-profile-btn"><i class="edit icon"></i> Edit Profile</button>
            </div>
        </div>

        <!-- Orders Card -->
        <div id="orders-card" style="display: none;">
            <div id="orders-details">
                <h2>My Orders</h2>
                <table class="ui celled table" id="orders-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Status</th>
                        <th>Description</th>
                    </tr>
                    </thead>
                    <tbody id="orders-body">
                    <tr>
                        <td colspan="5">Loading orders...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
